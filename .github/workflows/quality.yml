name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify H2 tests and JaCoCo coverage gate
        run: mvn -B -ntp -Dspring.profiles.active=test verify
      - name: Check Java source line lengths
        run: sh scripts/check-source-lines.sh
