spring:
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: fincore-api
  datasource:
    url: ${FINCORE_DB_URL:jdbc:h2:file:./.local/fincore;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${FINCORE_DB_USERNAME:sa}
    password: ${FINCORE_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:5502}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${FINCORE_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
fincore:
  frontend-origins: ${FINCORE_FRONTEND_ORIGINS:http://127.0.0.1:5501,http://localhost:5501}
logging:
  level:
    root: INFO
    com.portfolio.fincore: INFO